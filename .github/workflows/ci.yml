name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build app and DMG
        env:
          IPOMO_ARCHS: arm64 x86_64
          IPOMO_BUILD: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export IPOMO_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./scripts/build-app.sh release
          ./scripts/make-dmg.sh "dist/iPomo-${IPOMO_VERSION:-1.0.0}.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iPomo-dmg
          path: |
            dist/iPomo-*.dmg
            dist/iPomo-*.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: iPomo-dmg
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/iPomo-*.dmg dist/iPomo-*.dmg.sha256 \
            --verify-tag \
            --title "iPomo ${GITHUB_REF_NAME#v}" \
            --generate-notes
